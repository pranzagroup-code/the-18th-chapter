<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="carTitle carDesc">
  <title id="carTitle">Ilustrasi vektor Mazda 3</title>
  <desc id="carDesc">Ilustrasi orisinal hatchback sporty sudut tiga perempat depan, bodi burgundy metalik. Bukan render resmi Mazda.</desc>
  <defs>
    <linearGradient id="paintBody" x1="180" y1="80" x2="760" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C24A63"/>
      <stop offset="0.28" stop-color="#8B263E"/>
      <stop offset="0.62" stop-color="#641E32"/>
      <stop offset="1" stop-color="#2A1018"/>
    </linearGradient>
    <linearGradient id="paintRoof" x1="260" y1="70" x2="620" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A1A28"/>
      <stop offset="1" stop-color="#1A0C12"/>
    </linearGradient>
    <linearGradient id="paintGlass" x1="280" y1="90" x2="560" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F0E5" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#3A4458"/>
      <stop offset="1" stop-color="#12151C"/>
    </linearGradient>
    <linearGradient id="paintHood" x1="120" y1="180" x2="360" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E07A8A"/>
      <stop offset="0.45" stop-color="#8B263E"/>
      <stop offset="1" stop-color="#4A1624"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="168" cy="248" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6D8"/>
      <stop offset="0.45" stop-color="#D7B777"/>
      <stop offset="1" stop-color="#8B263E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="groundShade" cx="470" cy="410" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="140" y1="250" x2="220" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4E4C1"/>
      <stop offset="0.5" stop-color="#8A8070"/>
      <stop offset="1" stop-color="#D7B777"/>
    </linearGradient>
    <linearGradient id="tire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A32"/>
      <stop offset="1" stop-color="#0C0C10"/>
    </linearGradient>
  </defs>

  <ellipse cx="470" cy="412" rx="310" ry="28" fill="url(#groundShade)"/>

  <!-- rear body mass -->
  <path fill="#3C1522" d="M568 198c48 8 128 28 176 72 18 17 36 48 42 74-38 18-128 32-214 28l-18-92c8-28 10-62 14-82z"/>

  <!-- main hatch silhouette -->
  <path fill="url(#paintBody)" d="M148 262c18-38 62-74 118-92 28-38 86-86 168-96 62-8 128 8 176 38 38 24 86 72 108 118 14 28 38 48 62 58 8 18 10 40 8 58-4 22-22 38-56 44-46 8-128 10-214 6-92-4-188-8-250-18-42-6-86-22-110-48-18-20-22-40-18-62 4-16 6-22 8-26z"/>

  <!-- roof -->
  <path fill="url(#paintRoof)" d="M318 86c70-12 148 2 214 32 28 14 70 48 92 74-54 8-148 6-230-8-46-8-92-22-118-40 8-22 24-46 42-58z"/>

  <!-- windshield -->
  <path fill="url(#paintGlass)" stroke="#D7B777" stroke-opacity="0.25" stroke-width="1.2" d="M332 118c52-18 128-16 188 10 18 8 46 28 64 48-62 10-150 8-226-6-10-18-16-36-26-52z"/>
  <!-- side glass -->
  <path fill="#1A222E" fill-opacity="0.92" d="M592 176c28 16 52 38 70 58-36 8-86 10-138 4 8-24 28-48 68-62z"/>
  <path fill="#F7F0E5" fill-opacity="0.12" d="M360 128c40-8 96-6 138 10-46 8-98 8-148 2 2-6 6-10 10-12z"/>

  <!-- hood -->
  <path fill="url(#paintHood)" d="M176 214c46-36 108-62 168-70 8 22 14 48 12 78-52 12-112 28-162 52-10-18-16-38-18-60z"/>
  <path fill="none" stroke="#D7B777" stroke-opacity="0.28" stroke-width="1.3" d="M196 228c42-22 98-40 154-48"/>
  <path fill="none" stroke="#2A1018" stroke-opacity="0.4" stroke-width="1.4" d="M214 250c48-16 108-28 164-34"/>

  <!-- character line -->
  <path fill="none" stroke="#F3C7CF" stroke-opacity="0.22" stroke-width="2" d="M248 286c90-18 210-28 340-12 48 6 108 22 154 48"/>
  <path fill="none" stroke="#1A0C12" stroke-opacity="0.45" stroke-width="2" d="M260 304c96-14 220-20 348 2"/>

  <!-- lower valance -->
  <path fill="#12080C" d="M170 318c28 20 86 40 170 48 120 12 260 14 360 4 18 14 8 28-24 34-110 16-250 18-372 6-54-6-102-22-126-44 4-16 8-32 12-48z"/>

  <!-- grille / signature wing -->
  <path fill="#0C0C10" d="M148 250c22-8 48-6 70 8 8 14 4 28-12 36-28 8-56 2-70-14-6-10-2-22 12-30z"/>
  <path fill="url(#chrome)" d="M156 256c18-6 40-4 58 8-8 10-24 16-44 12-14-2-22-10-14-20z"/>
  <path fill="#D7B777" fill-opacity="0.55" d="M164 262c10-2 22 0 30 6-8 4-18 6-28 4-6-2-8-6-2-10z"/>

  <!-- headlight -->
  <ellipse cx="176" cy="248" rx="38" ry="16" fill="url(#lampGlow)"/>
  <path fill="#F7F0E5" d="M148 246c22-12 52-10 70 4-8 10-28 16-54 12-12-2-18-8-16-16z"/>
  <path fill="#D7B777" d="M154 248c16-8 40-6 54 4-10 6-28 10-48 6-8-2-10-6-6-10z"/>
  <circle cx="198" cy="252" r="4.5" fill="#FFF8E8"/>

  <!-- fog / bumper highlight -->
  <path fill="#2A1A20" d="M186 304c18 8 40 12 62 12-6 10-28 14-52 8-16-4-20-12-10-20z"/>
  <path fill="#D7B777" fill-opacity="0.35" d="M196 310c12 2 28 4 40 2-4 4-16 6-30 4-10-2-14-4-10-6z"/>

  <!-- side mirror -->
  <path fill="#4A1A28" stroke="#D7B777" stroke-opacity="0.4" stroke-width="1" d="M318 188c18-8 34-4 40 8-10 10-26 12-40 6-6-2-8-8 0-14z"/>
  <path fill="#1A1216" d="M328 192c10-4 20-2 24 4-8 6-18 6-26 2-2-2-2-4 2-6z"/>

  <!-- door lines -->
  <path fill="none" stroke="#1A0C12" stroke-opacity="0.55" stroke-width="1.6" d="M404 186c8 40 10 78 4 128"/>
  <path fill="none" stroke="#1A0C12" stroke-opacity="0.4" stroke-width="1.4" d="M538 196c10 36 14 72 8 118"/>
  <path fill="none" stroke="#F7F0E5" stroke-opacity="0.12" stroke-width="1.2" d="M412 210c6 34 8 70 2 108"/>

  <!-- handle -->
  <rect x="448" y="248" width="28" height="5" rx="2.5" fill="#D7B777" fill-opacity="0.55"/>

  <!-- rear lamp hint -->
  <path fill="#C45B4A" d="M782 268c16 8 24 20 22 34-14 4-30 4-44-2 4-14 10-26 22-32z"/>
  <path fill="#F0C3A0" fill-opacity="0.6" d="M776 274c10 4 16 12 16 20-8 2-18 2-26-2 2-8 6-14 10-18z"/>

  <!-- window trim -->
  <path fill="none" stroke="#D7B777" stroke-opacity="0.2" stroke-width="1.4" d="M340 116c70-16 170-4 250 42"/>

  <!-- front wheel -->
  <g transform="translate(268 338)">
    <ellipse cx="0" cy="8" rx="52" ry="14" fill="#000" opacity="0.35"/>
    <ellipse cx="0" cy="0" rx="46" ry="46" fill="#0C0C10"/>
    <ellipse cx="0" cy="0" rx="44" ry="44" fill="url(#tire)"/>
    <ellipse cx="0" cy="0" rx="30" ry="30" fill="#2C2C34" stroke="#D7B777" stroke-width="1.6"/>
    <g stroke="#C9B48A" stroke-width="3.2" stroke-linecap="round">
      <path d="M0-24 L0-8"/>
      <path d="M22.8-7.4 L7.4-2.4"/>
      <path d="M14.1 19.4 L4.6 6.3"/>
      <path d="M-14.1 19.4 L-4.6 6.3"/>
      <path d="M-22.8-7.4 L-7.4-2.4"/>
    </g>
    <circle r="8" fill="#E8D5A3"/>
    <circle r="3.2" fill="#3A2A18"/>
  </g>

  <!-- rear wheel -->
  <g transform="translate(690 346) scale(0.92 1)">
    <ellipse cx="0" cy="8" rx="50" ry="13" fill="#000" opacity="0.32"/>
    <ellipse cx="0" cy="0" rx="44" ry="44" fill="#0C0C10"/>
    <ellipse cx="0" cy="0" rx="42" ry="42" fill="url(#tire)"/>
    <ellipse cx="0" cy="0" rx="28" ry="28" fill="#26262E" stroke="#D7B777" stroke-width="1.4"/>
    <g stroke="#C9B48A" stroke-width="3" stroke-linecap="round">
      <path d="M0-22 L0-8"/>
      <path d="M20.9-6.8 L6.8-2.2"/>
      <path d="M12.9 17.8 L4.2 5.8"/>
      <path d="M-12.9 17.8 L-4.2 5.8"/>
      <path d="M-20.9-6.8 L-6.8-2.2"/>
    </g>
    <circle r="7.2" fill="#E8D5A3"/>
    <circle r="3" fill="#3A2A18"/>
  </g>

  <!-- wheel arch lips -->
  <path fill="none" stroke="#4A1A28" stroke-width="6" d="M220 318c8-34 30-56 52-56s46 22 52 56"/>
  <path fill="none" stroke="#4A1A28" stroke-width="6" d="M646 326c8-32 28-52 48-52s44 20 50 52"/>

  <!-- gold edge highlight -->
  <path fill="none" stroke="#D7B777" stroke-opacity="0.22" stroke-width="1.5" d="M164 258c36-48 110-92 214-108 86-14 176 8 246 52"/>
  <path fill="#F7F0E5" fill-opacity="0.08" d="M210 200c40-24 90-40 138-44-8 28-10 52-8 74-50 10-98 26-140 46-4-24-2-52 10-76z"/>
</svg>
